{% extends "layout.html" %}

{% block title %}
    {{ title }}
{% endblock %}

{% block main %}
    <h2 class="mb-4">{{ title }}</h2>
    <form action="{{ action }}" method="post">
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="name" placeholder="Name of unit" type="text" value="{{ unit.name }}">
        </div>
        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="length" placeholder="Length in meters" type="text" value="{{ unit.length }}" pattern="[0-9]+([\.,][0-9]+)?" step="0.01" title="This should be a number with up to 2 decimal places">
        </div>
        <input type="hidden" name="unit_id" value="{{ unit.id }}">
        <button class="btn btn-primary" type="submit">Save unit</button>
    </form>
{% endblock %}
