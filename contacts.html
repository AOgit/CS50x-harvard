        <title>Contacts</title>
        <script>
            document.addEventListener('DOMContentLoaded', function(){

                let ancorLinks = document.querySelectorAll('.list-group-item')

                for (let i = 0; i < ancorLinks.length; i++)
                {
                    ancorLinks[i].addEventListener('click', function(event) {
                        remAllActive();
                        ancorLinks[i].classList.add("active");
                    })
                }

            })

            function remAllActive()
            {
                let elements = document.querySelectorAll('.list-group-item')
                for (var i = 0; i < elements.length; i++)
                {
                    elements[i].classList.remove('active');
                }
            }

        </script>
