<!DOCTYPE html>

<html lang="en">
    <head>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>Trivia!</title>
        <script>
            document.addEventListener('DOMContentLoaded', function(){
                // When correct answer is clicked change background to green
                let correct = document.querySelector('.correct');
                correct.addEventListener('click', function(){
                    correct.style.backgroundColor = 'green';
                    document.querySelector('#feedback1').innerHTML = 'Correct';
                })

                // When incorrect answer is clicked change background to green
                let incorrects = document.querySelectorAll('.incorrect');
                for (let i = 0; i < incorrects.length; i++)
                {
                    incorrects[i].addEventListener('click', function(){
                        incorrects[i].style.backgroundColor = 'red';
                        document.querySelector('#feedback1').innerHTML = 'Incorrect';
                    })
                }
            } )

            function checkAnswer()
            {
                let answer = document.querySelector('input');
                if (answer.value === 'Switzerland')
                {
                    answer.style.backgroundColor = 'green';
                    document.querySelector('#feedback2').innerHTML = 'Correct';
                }
                else
                {
                    answer.style.backgroundColor = 'red';
                    document.querySelector('#feedback2').innerHTML = 'Incorrect';
                }
            }

        </script>
    </head>
    <body>
        <div class="header">
            <h1>Trivia!</h1>
        </div>

        <div class="container">
            <div class="section">
                <h2>Part 1: Multiple Choice </h2>
                <hr>
                <!-- TODO: Add multiple choice question here -->
                 <h3>What is the aproximate ratio of people to sheep in New Zeland?</h3>
                 <button class = "incorrect">6 people per 1 sheep</button>
                 <button class = "incorrect">4 people per 1 sheep</button>
                 <button class = "correct">3 people per 1 sheep</button>
                 <button class = "incorrect">1 person per 1 sheep</button>
                 <button class = "incorrect">1 person per 3 sheep</button>
                 <button class = "incorrect">1 person per 5 sheep</button>

                 <div id="feedback1"></div>
            </div>

            <div class="section">
                <h2>Part 2: Free Response</h2>
                <hr>
                <!-- TODO: Add free response question here -->
                 <h3>In which country is it illegal to own only one guinea pig, as a lone guinea pig might get lonely?</h3>
                 <input type="text">
                 <button onClick="checkAnswer(); return false;">Check Answer</button>
                 <div id="feedback2"></div>
            </div>
        </div>
    </body>
</html>
